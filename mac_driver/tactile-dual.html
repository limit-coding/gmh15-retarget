<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GMH15 双手 · 触觉接触定位</title><style>
:root{color-scheme:dark;--bg:#10171d;--panel:#18232c;--text:#e5edf2;--muted:#9fb1bf;--line:#2d414e;--cyan:#59d9c2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1400px;margin:auto;padding:26px}h1{font-size:27px;margin:0}h2{font-size:20px;margin:0}h3{font-size:16px;margin:0}p,small{color:var(--muted)}p{margin:8px 0}.controls{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:22px 0;padding:14px 0;border-block:1px solid var(--line)}label{display:flex;align-items:center;gap:8px}select,button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 10px}button{cursor:pointer}input{accent-color:var(--cyan)}.media-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}.media-grid figure{margin:0;min-width:0}.media-grid img{width:100%;aspect-ratio:4/3;object-fit:contain;background:#0b1014;display:block;border-radius:7px}.media-grid figcaption{font-size:12px;color:var(--muted);margin:5px 0}.media-grid h3{margin-bottom:6px}.media-grid select{max-width:100%;font-size:12px;padding:3px}.media-note{min-height:36px;font-size:12px;color:var(--muted)}.joint-table{width:100%;font-size:12px;border-collapse:collapse;font-variant-numeric:tabular-nums}.joint-table th,.joint-table td{padding:4px;text-align:right;border-bottom:1px solid var(--line)}.joint-table th:first-child,.joint-table td:first-child{text-align:left}.joint-info{font-size:12px;color:var(--cyan);margin:6px 0}.hands{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}.hand{min-width:0}.identity{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}.status{color:var(--cyan);font-size:13px}.bad{color:#ff9d87!important}.metrics{display:flex;gap:20px;flex-wrap:wrap;margin:12px 0}.metrics strong{display:block;font-size:21px;font-variant-numeric:tabular-nums}.overview{width:100%;height:auto;display:block}.skeleton{fill:#20303b;stroke:#3d5564;stroke-width:1.2}.pad{fill:#17434a;stroke:#409c99;stroke-width:1}.ovlabel{font:13px system-ui;fill:#b9cbd4}.contact{stroke:#f8e3ad;stroke-width:1;fill-opacity:.8}.fingers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}article{min-width:0;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:14px}.top{display:flex;justify-content:space-between;gap:5px;flex-wrap:wrap}.force{font-size:23px;font-variant-numeric:tabular-nums}.force small{font-size:12px}.scatter{display:block;width:100%;height:180px}.values{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.coords{font:12px/1.5 ui-monospace,monospace;min-height:38px;overflow-wrap:anywhere}.details{margin-top:8px}summary{cursor:pointer;color:var(--muted);font-size:12px}.heat{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px;margin-top:6px}.taxel{aspect-ratio:1;display:grid;place-items:center;font-size:9px;min-width:0}.legend{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted)}.ramp{width:110px;height:8px;background:linear-gradient(90deg,#16303a,#238b91,#57ddbf,#ffc265)}#note{font-size:13px;max-width:1050px}.wide{grid-column:1/-1}footer{margin-top:24px;color:var(--muted);font-size:13px}.help{color:#b8cbd2;font-size:12px;margin-top:6px}#network{color:var(--cyan)}@media(max-width:960px){.hands{grid-template-columns:1fr}}@media(max-width:480px){main{padding:14px}.fingers{grid-template-columns:1fr}.metrics{gap:14px}h1{font-size:22px}}
</style></head><body><main>
<h1>GMH15 双手 · 关节、相机与触觉</h1><p id="network" role="status" aria-live="polite">正在连接双手…</p>
<p id="note">位置来自 SDK 按压坐标接口。手形仅用于定位所属指尖；下方坐标图显示传感器原生坐标，单位与轴向尚待厂商/实按核对。327 个原始测点未获完整物理坐标表，仍保留为编号数据。</p>
<div class="controls"><label>坐标投影 <select id="plane"><option value="xy">X–Y</option><option value="xz">X–Z</option><option value="yz">Y–Z</option></select></label><label>接触阈值 <select id="threshold"><option value="0.1">0.1 N</option><option value="0.3" selected>0.3 N</option><option value="0.5">0.5 N</option><option value="1">1.0 N</option></select></label><label>颜色满量程 <input id="scale" type="range" min="0.5" max="10" step="0.5" value="2"><span id="scaleLabel">2 N</span></label><button id="pause">暂停画面</button><button id="save">保存双手当前帧</button><span class="legend">0 <span class="ramp"></span><span id="maxLabel">2 N</span></span></div>
<div class="hands" id="hands"></div><footer>圆心＝SDK 接触坐标；圆大小及颜色＝该接触点力度。圆圈和指尖轮廓不表示真实接触面积或毫米比例。温度及五指合力独立显示，接触点力度不与指端合力混用。未标定、未使能电机；暂停仅冻结画面。双手采集占用各自串口，执行动作前需停止采集容器。</footer>
</main><script>
const keys=['index','middle','ring','pinky','thumb'],names=['食指','中指','无名指','小指','拇指'],sides=['left','right'];let latest=null,paused=false,selected=null;const bounds={};
function svgEl(name,attrs){const e=document.createElementNS('http://www.w3.org/2000/svg',name);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e}
function color(v){const t=Math.min(Math.abs(v)/Number(document.querySelector('#scale').value),1),stops=[[22,48,58],[35,139,145],[87,221,191],[255,194,101]],x=t*3,i=Math.min(Math.floor(x),2),a=x-i;return `rgb(${stops[i].map((v,k)=>Math.round(v*(1-a)+stops[i+1][k]*a)).join(',')})`}
function contactFor(h,key){return(h.contacts||[]).filter(p=>p.model===key+'_tip'&&p.force>=Number(document.querySelector('#threshold').value))}
for(const side of sides){const section=document.createElement('section');section.className='hand';section.id=side;section.innerHTML=`<div class="identity"><h2>${side==='left'?'左手':'右手'}</h2><span class="status" aria-live="polite">连接中</span></div><small class="sn">—</small><div class="metrics"><div><small>采样频率</small><strong class="hz">—</strong></div><div><small>帧龄</small><strong class="age">—</strong></div><div><small>有效接触点</small><strong class="contacts">—</strong></div><div><small>电机</small><strong class="motor">—</strong></div></div><svg class="overview" viewBox="0 0 620 340" role="img" aria-label="${side==='left'?'左手':'右手'}指尖接触位置示意"></svg><div class="fingers"></div>`;document.querySelector('#hands').append(section);const svg=section.querySelector('svg');svg.append(svgEl('rect',{x:145,y:160,width:300,height:140,rx:48,class:'skeleton'}));const heights=[120,145,130,95,85],order=side==='left'?[3,2,1,0,4]:[4,0,1,2,3];for(let col=0;col<5;col++){const i=order[col],x=55+col*108,y=i===4?128:170-heights[i];svg.append(svgEl('rect',{x:x-30,y,width:66,height:heights[i]+65,rx:30,class:'skeleton'}));svg.append(svgEl('ellipse',{cx:x+3,cy:y+32,rx:25,ry:27,class:'pad'}));const text=svgEl('text',{x:x+3,y:y-8,'text-anchor':'middle',class:'ovlabel'});text.textContent=names[i];svg.append(text);const g=svgEl('g',{'data-finger':keys[i],'data-x':x+3,'data-y':y+32});svg.append(g)}const caption=svgEl('text',{x:300,y:325,'text-anchor':'middle',class:'ovlabel'});caption.textContent='指尖所属位置示意 · 圆点显示 SDK 接触坐标投影';svg.append(caption);for(let i=0;i<5;i++){const a=document.createElement('article');a.id=side+'-'+keys[i];a.innerHTML=`<div class="top"><h3>${names[i]}</h3><small class="temperature">— °C</small></div><div class="force">— <small>N 法向合力</small></div><div class="values">—</div><canvas class="scatter" role="img" aria-label="${names[i]} SDK 接触坐标投影"></canvas><div class="coords">等待接触数据</div><details class="details"><summary>原始测点（编号排列）</summary><div class="heat"></div></details>`;section.querySelector('.fingers').append(a);bounds[side+'-'+keys[i]]=20}}
const mediaViews={left:'oblique',right:'oblique'};
for(const side of sides){const section=document.getElementById(side),panel=document.createElement('div');panel.innerHTML=`<div class="media-grid"><figure><h3>MuJoCo · 官方 URDF</h3><img class="sim-image" alt="${side} MuJoCo实时关节复现"><figcaption><select class="view" aria-label="MuJoCo观察视角"><option value="oblique">斜视</option><option value="front">视角 A</option><option value="back">视角 B</option><option value="side">侧视</option></select> <span class="sim-stat">准备渲染</span></figcaption></figure><figure><h3>掌内相机 · 真机</h3><img class="camera-image" alt="${side} 掌内相机实时画面"><figcaption class="camera-stat">准备相机</figcaption></figure></div><div class="media-note">仿真仅复现编码器反馈，不进行动力学步进或硬件控制。相机为原始画面，未做镜头畸变校正。</div><details open><summary>关节反馈（度）</summary><div class="joint-info">等待官方运动学解算</div><table class="joint-table"><thead><tr><th>手指</th><th>MCP / CMC</th><th>PIP / MCP</th><th>DIP / IP</th></tr></thead><tbody>${names.map(n=>`<tr><th>${n}</th><td>—</td><td>—</td><td>—</td></tr>`).join('')}</tbody></table></details>`;section.insertBefore(panel,section.querySelector('.overview'));panel.querySelector('.view').onchange=e=>mediaViews[side]=e.target.value;
 const detail=document.createElement('details');detail.className='details';const summary=document.createElement('summary');summary.textContent='触觉：接触位置与测点详情';detail.append(summary);detail.append(section.querySelector('.overview'),section.querySelector('.fingers'));section.append(detail);
 for(const kind of ['sim','camera']){const img=panel.querySelector('.'+kind+'-image');let timer;const next=()=>{clearTimeout(timer);timer=setTimeout(()=>{if(!paused)img.src=`/media/${kind}/${side}.jpg?view=${mediaViews[side]}&t=${Date.now()}`;else next()},kind==='sim'?300:150)};img.onload=next;img.onerror=()=>{clearTimeout(timer);timer=setTimeout(()=>{if(!paused)img.src=`/media/${kind}/${side}.jpg?view=${mediaViews[side]}&t=${Date.now()}`;else next()},1000)};next()}
}
function updateMedia(frame){for(const side of sides){const s=document.getElementById(side),hand=frame.hands[side],sim=frame.media?.['sim-'+side],cam=frame.media?.['camera-'+side];s.querySelector('.sim-stat').textContent=sim?.ok?(sim.live_pose?'实时15关节':'参考零位 · 无有效关节')+' / '+sim.fps+' fps':(sim?.error||'渲染准备中');s.querySelector('.sim-stat').classList.toggle('bad',!sim?.live_pose);s.querySelector('.camera-stat').textContent=cam?.ok?`${cam.width}×${cam.height} / ${cam.fps} fps / ${cam.age_ms} ms`:(cam?.error||'相机准备中');const ok=hand?.joints_degrees?.length===15&&!hand.joint_error;s.querySelector('.joint-info').textContent=ok?'15关节 · 实测电机与磁编码器 → 官方正解':(hand?.joint_error||'关节反馈未就绪');s.querySelector('.joint-info').classList.toggle('bad',!ok);s.querySelectorAll('.joint-table tbody tr').forEach((tr,i)=>{tr.querySelectorAll('td').forEach((td,j)=>{td.textContent=ok?hand.joints_degrees[i*3+j].toFixed(1)+'°':'—'})})}}
function axes(){const p=document.querySelector('#plane').value;return p==='xy'?[0,1]:p==='xz'?[0,2]:[1,2]}
function chart(canvas,pts,bound){const w=canvas.clientWidth,h=180,dpr=devicePixelRatio||1;canvas.width=w*dpr;canvas.height=h*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);const[ai,bi]=axes(),px=x=>32+(w-42)*(x/bound+1)/2,py=y=>150-135*(y/bound+1)/2;c.strokeStyle='#36505e';c.lineWidth=1;c.beginPath();c.moveTo(32,15);c.lineTo(32,150);c.lineTo(w-10,150);c.moveTo(px(0),15);c.lineTo(px(0),150);c.moveTo(32,py(0));c.lineTo(w-10,py(0));c.stroke();c.fillStyle='#a9beca';c.font='10px system-ui';for(const v of[-bound,0,bound]){c.fillText(String(v),Math.max(0,px(v)-8),165);c.fillText(String(v),4,py(v)+3)}c.fillText('XYZ'[ai],w-12,178);c.fillText('XYZ'[bi],18,12);for(const p of pts){c.beginPath();c.arc(px(p.xyz[ai]),py(p.xyz[bi]),Math.min(17,4+Math.sqrt(p.force)*5),0,Math.PI*2);c.fillStyle=color(p.force);c.fill();c.strokeStyle='#ffe2a1';c.stroke();if(p===pts.reduce((a,b)=>a.force>=b.force?a:b)){c.fillStyle='#ecf4f6';c.fillText(p.force.toFixed(1)+' N',Math.min(w-42,px(p.xyz[ai])+6),Math.max(12,py(p.xyz[bi])-8))}}if(!pts.length){c.fillStyle='#9fb1bf';c.fillText('无超过阈值的接触点',Math.max(38,(w-110)/2),84)}}
function render(){if(!latest)return;const[ai,bi]=axes();for(const side of sides){const h=latest.hands[side];if(!h)continue;const section=document.getElementById(side);section.querySelector('.sn').textContent=(h.sn||'身份未确认')+' · '+(h.hand||'');const valid=h.connected&&h.age_ms<1500;section.style.opacity=valid?'1':'.6';section.querySelector('.contacts').textContent=valid?(h.contacts||[]).filter(p=>p.force>=Number(document.querySelector('#threshold').value)).length:'—';if(!h.fingers)continue;for(const f of h.fingers){const a=document.getElementById(side+'-'+f.key),pts=valid?contactFor(h,f.key):[],id=side+'-'+f.key;let bound=bounds[id];for(const p of pts)bound=Math.max(bound,Math.ceil(Math.max(...p.xyz.map(Math.abs))/10)*10);bounds[id]=bound;a.querySelector('.temperature').textContent=f.temperature.toFixed(1)+' °C';a.querySelector('.force').innerHTML=f.force[2].toFixed(2)+' <small>N 法向合力</small>';a.querySelector('.values').textContent=`X ${f.force[0].toFixed(2)} · Y ${f.force[1].toFixed(2)} · Z ${f.force[2].toFixed(2)} N`;chart(a.querySelector('canvas'),pts,bound);a.querySelector('.coords').textContent=pts.length?pts.map(p=>`(${p.xyz.join(', ')}) → ${p.force.toFixed(2)} N`).join(' | '):'无超过阈值的接触点';const group=section.querySelector(`[data-finger="${f.key}"]`);group.replaceChildren();for(const p of pts){const dot=svgEl('circle',{cx:Number(group.dataset.x)+p.xyz[ai]/bound*24,cy:Number(group.dataset.y)-p.xyz[bi]/bound*24,r:Math.min(12,3+Math.sqrt(p.force)*4),fill:color(p.force),class:'contact'}),title=svgEl('title',{});title.textContent=`${f.name} (${p.xyz.join(', ')}) / ${p.force.toFixed(2)} N`;dot.append(title);group.append(dot)}const heat=a.querySelector('.heat');if(heat.children.length!==f.points.length){heat.replaceChildren();f.points.forEach((_,i)=>{const el=document.createElement('span');el.className='taxel';el.textContent=i+1;heat.append(el)})}f.points.forEach((p,i)=>{heat.children[i].style.background=color(p[2]);heat.children[i].title=`#${i+1}: X=${p[0]}, Y=${p[1]}, Z=${p[2]} N`})}}}
async function poll(){try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const frame=await r.json();if(!paused)updateMedia(frame);let all=true;for(const side of sides){const h=frame.hands[side],s=document.querySelector('#'+side+' .status'),valid=h?.connected&&h.age_ms<1500;all&&=valid;s.textContent=valid?'在线 · 只读':(h?.error||'数据已过期');s.classList.toggle('bad',!valid);document.querySelector('#'+side+' .hz').textContent=(h?.sample_hz||0).toFixed(1)+' Hz';document.querySelector('#'+side+' .age').textContent=h?.age_ms==null?'—':h.age_ms+' ms';document.querySelector('#'+side+' .motor').textContent=h?.motor_enabled===false?'未使能':'未知'}document.querySelector('#network').textContent=(all?'双手实时连接':'部分设备离线')+(paused?' · 画面已暂停':' · 接触坐标实时更新');if(!paused){latest=frame;render()}}catch(e){document.querySelector('#network').textContent='连接中断 · '+e.message;document.querySelectorAll('.status').forEach(s=>{s.textContent='连接中断';s.classList.add('bad')})}finally{setTimeout(poll,100)}}
for(const id of['plane','threshold','scale'])document.getElementById(id).oninput=()=>{const s=document.querySelector('#scale').value;document.querySelector('#scaleLabel').textContent=s+' N';document.querySelector('#maxLabel').textContent=s+' N';render()};document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'恢复画面':'暂停画面'};document.querySelector('#save').onclick=()=>{if(!latest)return;const url=URL.createObjectURL(new Blob([JSON.stringify(latest,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='gmh15-dual-tactile.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};addEventListener('resize',render);poll();
</script></body></html>
